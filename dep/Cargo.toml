[package]
name = "dep"
version = "0.1.0"
authors = ["roal_yr"]
edition = "2024"


[dependencies]
bincode          = { version = "1.3",  default-features = false }
colored          = { version = "2.2",  default-features = false }
deepsize         = { version = "0.2",  default-features = false }
hex              = { version = "0.4",  default-features = true }
lazy_static      = { version = "1.5",  default-features = false }
line_drawing     = { version = "1.0",  default-features = false }
lz4              = { version = "1.28", default-features = false }
noise            = { version = "0.9",  default-features = false }
num              = { version = "0.4",  default-features = false }
oorandom         = { version = "11.1", default-features = false }
pathfinding      = { version = "4.14", default-features = false }
png              = { version = "0.17", default-features = false }
resize           = { version = "0.8",  default-features = false }
ron              = { version = "0.8",  default-features = false }
serde            = { version = "1.0",  default-features = false, features = ["derive"] }
substring        = { version = "1.4",  default-features = false }
terminal_size    = { version = "0.4",  default-features = false }
textwrap         = { version = "0.16", default-features = false, features = ["terminal_size"] }
toml             = { version = "0.8",  default-features = false, features = ["parse"] }